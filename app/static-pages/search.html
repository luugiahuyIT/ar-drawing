<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>

<title>PhotoTrace AR - Search</title>

<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom coral gradient based on requirements, using closest Tailwind equivalents to #FB7185 -> #F43F5E */
        .bg-coral-gradient {
            background: linear-gradient(to right, #FB7185, #F43F5E);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface h-screen w-full flex flex-col font-sans overflow-hidden">
<!-- Top Zone -->
<div class="w-full pt-12 pb-4 px-margin-mobile flex items-center justify-between gap-4 sticky top-0 z-50 bg-surface">
<div class="flex-1 relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input autofocus="" class="w-full h-[48px] pl-12 pr-4 bg-surface-container rounded-xl border-2 border-primary-container focus:ring-0 focus:outline-none text-on-surface font-body-md text-body-md placeholder-outline-variant" placeholder="Search templates..." type="text"/>
</div>
<button class="text-primary-container font-button-label text-button-label active:opacity-70 transition-opacity">
            Cancel
        </button>
</div>
<!-- Middle Zone -->
<div class="flex-1 overflow-y-auto w-full no-scrollbar px-margin-mobile">
<!-- Trending Searches -->
<div class="mt-6 mb-8">
<h2 class="font-subheadline text-subheadline text-on-surface mb-4">Trending searches</h2>
<div class="flex overflow-x-auto no-scrollbar gap-3 pb-2 -mx-margin-mobile px-margin-mobile">
<button class="bg-coral-gradient px-6 py-2.5 rounded-full flex-shrink-0 active:scale-95 transition-transform shadow-sm">
<span class="text-on-primary font-button-label text-button-label">pet</span>
</button>
<button class="bg-coral-gradient px-6 py-2.5 rounded-full flex-shrink-0 active:scale-95 transition-transform shadow-sm">
<span class="text-on-primary font-button-label text-button-label">flower</span>
</button>
<button class="bg-coral-gradient px-6 py-2.5 rounded-full flex-shrink-0 active:scale-95 transition-transform shadow-sm">
<span class="text-on-primary font-button-label text-button-label">cat</span>
</button>
<button class="bg-coral-gradient px-6 py-2.5 rounded-full flex-shrink-0 active:scale-95 transition-transform shadow-sm">
<span class="text-on-primary font-button-label text-button-label">dog</span>
</button>
</div>
</div>
<!-- Categories Section -->
<div class="mb-12">
<h2 class="font-subheadline text-subheadline text-on-surface mb-6">Categories</h2>
<div class="grid grid-cols-2 gap-y-6 gap-x-4">
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Pets</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Flowers</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Animals</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Nature</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Portraits</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Fantasy</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Lettering</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Geometry</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
<button class="text-left py-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-between group border-b border-surface-container pb-3">
<span>Architecture</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
