<!-- Script for basic interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const faqItems = document.querySelectorAll('.faq-item:not(.expanded)');
            
            faqItems.forEach(item => {
                item.addEventListener('click', () => {
                    // In a real app, this would expand the item. 
                    // For this static demo, we'll just add a brief visual feedback.
                    const icon = item.querySelector('.faq-icon');
                    item.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        item.style.transform = 'scale(1)';
                        // Toggle a temporary expanded look (without actual content)
                        icon.style.transform = icon.style.transform === 'rotate(90deg)' ? 'rotate(0deg)' : 'rotate(90deg)';
                    }, 150);
                });
            });
        });
    </script>
