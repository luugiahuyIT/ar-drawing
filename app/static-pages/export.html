        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background font-body-md text-on-background antialiased flex justify-center min-h-screen">
<!-- App Container (Simulating Mobile Device Viewport) -->
<main class="w-full max-w-[400px] h-[850px] relative overflow-hidden bg-surface-container-high shadow-xl shadow-primary-container/10 border-x border-outline-variant/20 mx-auto">
<!-- Background Canvas (Simulating App Content behind Overlay) -->
<div class="absolute inset-0 p-margin-mobile flex flex-col items-center justify-center opacity-30">
<span class="material-symbols-outlined text-6xl text-outline mb-4">draw</span>
<p class="font-subheadline text-subheadline text-outline text-center">AR Canvas Active</p>
</div>
<!-- Dark Overlay -->
<div class="absolute inset-0 bg-inverse-surface/60 backdrop-blur-sm z-40 transition-opacity duration-300"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 w-full bg-surface rounded-t-[24px] pt-stack-sm pb-margin-mobile px-margin-mobile z-50 flex flex-col items-center shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.3)] translate-y-0 transition-transform duration-300 ease-out">
<!-- Drag Handle -->
<div class="w-10 h-1 bg-outline-variant rounded-full mb-stack-md cursor-grab active:cursor-grabbing"></div>
<!-- Title -->
<h2 class="font-subheadline text-subheadline text-on-surface w-full text-center mb-stack-md font-bold tracking-tight">Export drawing</h2>
<!-- Preview Square -->
<div class="w-[200px] h-[200px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 flex items-center justify-center relative mb-stack-lg overflow-hidden group">
<!-- Inner soft shadow to frame the drawing area -->
<div class="absolute inset-0 shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)] pointer-events-none rounded-xl z-10"></div>
<!-- Drawing Image -->
<img class="w-[160px] h-[160px] object-contain opacity-90 group-hover:scale-105 transition-transform duration-500 ease-in-out" data-alt="A minimalist black line drawing of a cute, stylized fox sitting down. The continuous black ink lines are smooth and consistent against a pristine, pure white background. The aesthetic is clean, playful, and optimized for an augmented reality tracing tool template. High contrast, well-lit, vector-style artwork." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQgdD1EQHz4lFALTJPmiAE_Fr9rYGRQDlDFtYdLRC2JElqZCGF8B3-nCUd5etjYQ2COcCa15hQjwD7faxlJLDkr9kAuHTStjs2__4U8De0rDXPHK9d1v_mfrjzwVHOYRtXNWCMgec0WSX44IOb30aC5ov5mz1P3B3HLnchdiBzsuxF0NSPQqq5UQwGCVmOlOURaR_ZXKSy9qoS8j0qWbYlgPligVmYAQOWEzFhntwPFw-2WorhdR_KR9Gkrb5X2EkcwbsMBwRhM6gJ">
<!-- Watermark -->
<div class="absolute bottom-2 right-2 flex flex-col items-end z-20">
<span class="font-caption text-[9px] text-outline opacity-80 leading-tight">Made with</span>
<span class="font-caption text-[10px] text-on-surface font-bold leading-tight">PhotoTrace AR</span>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-stack-sm">
<!-- Ad Removal Button -->
<!-- Using theme Tertiary color to map to the requested distinct secondary action styling while maintaining theme compliance -->
<button class="w-full py-4 px-6 rounded-full border-2 border-tertiary text-tertiary flex items-center justify-center gap-2 hover:bg-tertiary/5 active:scale-[0.98] transition-all duration-200">
<span class="text-xl leading-none">🎁</span>
<span class="font-button-label text-button-label">Watch ad to remove watermark</span>
</button>
<!-- Primary Share Button -->
<!-- Using Primary color to map to the requested primary action while maintaining theme compliance -->
<button class="w-full py-4 px-6 text-on-primary flex items-center justify-center gap-2 hover:bg-primary/90 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98] transition-all duration-200" style="background: linear-gradient(135deg, rgb(79, 70, 229) 0%, rgb(129, 140, 248) 100%); border-radius: 24px; box-shadow: rgba(79, 70, 229, 0.2) 0px 10px 12px; border-width: medium; border-style: none; border-color: currentcolor; border-image: initial;">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios_share</span>
<span class="font-button-label text-button-label font-bold">Share</span>
</button>
<!-- Cancel Button -->
<button class="w-full py-3 mt-2 text-on-surface-variant font-button-label text-button-label text-center hover:text-on-surface active:opacity-70 transition-colors duration-200">
                    Cancel
                </button>
</div>
