<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PhotoTrace AR - Onboarding Interest Picker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-container": "#ab354b",
            "secondary": "#4953bc",
            "secondary-fixed-dim": "#bdc2ff",
            "on-background": "#1c1c18",
            "error-container": "#ffdad6",
            "inverse-surface": "#31302d",
            "on-tertiary": "#ffffff",
            "on-secondary-container": "#17228f",
            "outline": "#777587",
            "on-primary-fixed-variant": "#3323cc",
            "primary-fixed": "#e2dfff",
            "outline-variant": "#c7c4d8",
            "secondary-container": "#8792fe",
            "inverse-primary": "#c3c0ff",
            "surface-variant": "#e6e2dc",
            "on-error-container": "#93000a",
            "on-tertiary-container": "#ffd0d3",
            "tertiary": "#8b1b34",
            "surface-container-high": "#ebe8e2",
            "surface": "#fdf9f3",
            "background": "#fdf9f3",
            "on-surface-variant": "#464555",
            "surface-bright": "#fdf9f3",
            "primary-container": "#4f46e5",
            "tertiary-fixed": "#ffdadc",
            "primary-fixed-dim": "#c3c0ff",
            "tertiary-fixed-dim": "#ffb2b9",
            "on-error": "#ffffff",
            "on-tertiary-fixed": "#400010",
            "on-primary-fixed": "#0f0069",
            "on-secondary-fixed": "#000767",
            "primary": "#3525cd",
            "error": "#ba1a1a",
            "on-secondary": "#ffffff",
            "on-tertiary-fixed-variant": "#891933",
            "on-primary-container": "#dad7ff",
            "surface-dim": "#dddad4",
            "secondary-fixed": "#e0e0ff",
            "on-surface": "#1c1c18",
            "surface-container-low": "#f7f3ed",
            "surface-container-highest": "#e6e2dc",
            "surface-tint": "#4d44e3",
            "surface-container": "#f1ede7",
            "on-primary": "#ffffff",
            "inverse-on-surface": "#f4f0ea",
            "surface-container-lowest": "#ffffff",
            "on-secondary-fixed-variant": "#2f3aa3"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "margin-mobile": "20px",
            "margin-desktop": "64px",
            "container-max": "1280px",
            "stack-sm": "8px",
            "stack-lg": "48px",
            "gutter": "24px",
            "stack-md": "16px",
            "section-gap": "120px"
          },
          "fontFamily": {
            "headline-lg-mobile": ["Inter"],
            "caption": ["Inter"],
            "body-md": ["Inter"],
            "button-label": ["Inter"],
            "headline-lg": ["Inter"],
            "display-hero": ["Inter"],
            "subheadline": ["Inter"]
          },
          "fontSize": {
            "headline-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "caption": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
            "body-md": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "button-label": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "headline-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "display-hero": ["85px", { "lineHeight": "90px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
            "subheadline": ["24px", { "lineHeight": "32px", "letterSpacing": "0em", "fontWeight": "500" }]
          }
        }
      }
    }
  </script>
<style>
    /* Custom gradient for selected state to match specific colors requested, falling back to brand colors where appropriate */
    .bg-gradient-coral {
      background: linear-gradient(135deg, #FB7185 0%, #F43F5E 100%);
    }
    .text-selected {
      color: #ffffff;
    }
    .icon-selected {
      color: #ffffff;
      font-variation-settings: 'FILL' 1;
    }
    .card-unselected {
      background-color: #f7f3ed; /* surface-container-low */
      border: 1px solid #e6e2dc; /* surface-variant */
    }
    .text-unselected {
      color: #1c1c18; /* on-surface */
    }
    .icon-unselected {
      color: #464555; /* on-surface-variant */
      font-variation-settings: 'FILL' 0;
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-screen max-w-[1080px] mx-auto flex flex-col relative overflow-hidden select-none">
<!-- Status Bar (Simulated) -->
<div class="flex justify-between items-center px-[24px] pt-4 pb-2 text-xs font-semibold text-on-surface">
<span class="">9:41</span>
<div class="flex items-center space-x-1">
<span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[14px]">wifi</span>
<span class="material-symbols-outlined text-[14px]">battery_full</span>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col px-[24px] pt-[24px] pb-[24px]">
<!-- Top Zone: Headers -->
<div class="text-center mb-[32px] pt-[24px]">
<h1 class="text-[28px] font-bold text-on-surface mb-2 leading-tight">What interests you?</h1>
<p class="text-[16px] text-on-surface-variant">Pick any to personalize your Explore. Tap to select.</p>
</div>
<!-- Middle Zone: Grid -->
<div class="flex-1 flex items-center justify-center">
<div class="grid grid-cols-3 gap-[12px] w-full max-w-[600px] mx-auto aspect-square">
<!-- Row 1 -->
<!-- Pets -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">pets</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Pets</span>
</button>
<!-- Cute Creatures (SELECTED) -->
<button class="rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-[0_10px_30px_-15px_rgba(79,70,229,0.3)]" style="background: linear-gradient(135deg, rgb(79, 70, 229) 0%, rgb(129, 140, 248) 100%);">
<span class="material-symbols-outlined text-[40px] mb-2 icon-selected">cruelty_free</span>
<span class="text-[14px] font-medium text-selected leading-tight text-center">Cute Creatures</span>
</button>
<!-- Nature -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">park</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Nature</span>
</button>
<!-- Row 2 -->
<!-- Fantasy -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">castle</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Fantasy</span>
</button>
<!-- Portrait Basics -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">face</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Portrait Basics</span>
</button>
<!-- Lettering -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">format_paint</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Lettering</span>
</button>
<!-- Row 3 -->
<!-- Flowers (SELECTED) -->
<button class="rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-[0_10px_30px_-15px_rgba(79,70,229,0.3)]" style="background: linear-gradient(135deg, rgb(79, 70, 229) 0%, rgb(129, 140, 248) 100%);">
<span class="material-symbols-outlined text-[40px] mb-2 icon-selected">local_florist</span>
<span class="text-[14px] font-medium text-selected leading-tight text-center">Flowers</span>
</button>
<!-- Geometry -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">category</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Geometry</span>
</button>
<!-- Architecture -->
<button class="card-unselected rounded-xl flex flex-col items-center justify-center p-4 transition-transform active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-[40px] mb-2 icon-unselected">architecture</span>
<span class="text-[14px] font-medium text-unselected leading-tight text-center">Architecture</span>
</button>
</div>
</div>
<!-- Bottom Zone -->
<div class="mt-auto pt-8 flex flex-col items-center w-full">
<!-- Pagination Dots -->
<div class="flex items-center justify-center space-x-2 mb-[32px]"><div class="w-2 h-2 rounded-full" style="background-color: rgb(214, 211, 209);"></div><div class="w-2 h-2 rounded-full" style="background-color: rgb(214, 211, 209);"></div><div class="w-2 h-2 rounded-full" style="background-color: rgb(79, 70, 229);"></div></div>
<!-- Action Buttons -->
<div class="flex w-full space-x-[12px] pb-[12px]">
<!-- Skip Button -->
<button class="w-1/3 py-4 rounded-xl border border-surface-variant bg-surface-container-lowest text-on-surface-variant font-button-label text-button-label text-center transition-transform active:scale-95" style="border-radius: 24px; box-shadow: rgba(0, 0, 0, 0.2) 0px 4px 12px;">
          Skip
        </button>
<!-- Continue Button -->
<button class="w-2/3 py-4 rounded-xl text-white font-button-label text-button-label text-center transition-transform active:scale-95 flex items-center justify-center" style="background: linear-gradient(135deg, rgb(79, 70, 229) 0%, rgb(129, 140, 248) 100%); border-radius: 24px; box-shadow: rgba(79, 70, 229, 0.3) 0px 4px 12px;">
          Continue (2)
        </button>
</div>
</div>
</div>


</body></html>
