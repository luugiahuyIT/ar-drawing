<style>.camera-bg {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDBNkAT8eOs-v43bePeWOXrBPfse0iGP9nsEQoVhWqMBZ7lSXT6pVlh4dgE24CDczsQ-sctf29wT4MPpX40I8IG4zG3lRCo4TYw_AvOjVK5eBLtbAaWfBwFf1COdAwB-JGuKfNX9vBCXDz8OTiVnyad5xICV3ThgKerRdHdQLeuT13Pe_uRrYdCL91b2zjnd-iG-9Hi9hEaZlXpmx0nmlx2RrvNXGrQf352B-zJHz_UWJysPcY-hrJGNiGALxiOJ_pvBIE0TFvjGhwp);
    background-size: cover;
    background-position: center
    }
.coral-gradient {
    background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%)
    }
.coral-gradient-text {
    background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent
    }
.top-gradient {
    background: linear-gradient(to bottom, rgba(30, 27, 58, 0.7) 0%, transparent 100%)
    }
.bottom-gradient {
    background: linear-gradient(to top, rgba(30, 27, 58, 0.85) 0%, transparent 100%)
    }
/* Custom range slider styling for opacity control */
input[type=range] {
    -webkit-appearance: none;
    /* Hides the slider so that custom slider can be made */
    width: 100%;
    /* Specific width is required for Firefox. */
    background: transparent;
    /* Otherwise white in Chrome */
    }
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 24px;
    width: 24px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    margin-top: -10px;
    /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3)
    }
input[type=range]::-webkit-slider-runnable-track {
    width: 100%;
    height: 4px;
    cursor: pointer;
    background: linear-gradient(90deg, #fb7185 0%, #f43f5e 100%);
    border-radius: 2px
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <style>input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, #4F46E5 0%, #818CF8 100%) !important; } input[type=range]::-webkit-slider-thumb { border: 2px solid #4F46E5 !important; }</style></head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- AR Camera View Container -->
<main class="relative h-full w-full camera-bg" data-alt="A top-down view of a pristine white sheet of drawing paper resting on a warm, textured wooden desk. The scene is captured through a high-quality camera lens, acting as a viewfinder for an AR app. The lighting is bright and natural, casting soft shadows that enhance the realistic, professional atmosphere of a creative workspace ready for drawing.">
<!-- AR Overlay Layer (The traced image) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
<!-- Simulated AR Outline - Using a placeholder div to represent the dog outline, styled to match the prompt -->
<div class="relative w-[300px] h-[300px] md:w-[450px] md:h-[450px]" style="opacity: 0.5;">
<!-- Placeholder for the actual AR path data -->
<svg class="w-full h-full text-primary-container drop-shadow-md stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 100 100">
<path d="M20,50 Q30,20 50,20 T80,50 Q90,70 80,80 Q70,90 50,90 Q30,90 20,80 Q10,70 20,50 Z" stroke-dasharray="4 4"></path>
<!-- Eyes & Nose representation for the 'friendly dog face' -->
<circle cx="35" cy="45" fill="currentColor" r="4"></circle>
<circle cx="65" cy="45" fill="currentColor" r="4"></circle>
<ellipse cx="50" cy="65" fill="currentColor" rx="8" ry="5"></ellipse>
</svg>
</div>
</div>
<!-- Viewfinder Reticle / Guides (Optional immersive touch) -->
<div class="absolute inset-0 pointer-events-none z-0 flex flex-col justify-between p-8 opacity-30">
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-t-2 border-l-2 border-white"></div>
<div class="w-8 h-8 border-t-2 border-r-2 border-white"></div>
</div>
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-b-2 border-l-2 border-white"></div>
<div class="w-8 h-8 border-b-2 border-r-2 border-white"></div>
</div>
</div>
<!-- Top UI Overlay -->
<header class="absolute top-0 left-0 w-full z-50 top-gradient px-screen-margin md:px-margin-desktop py-stack-md flex justify-between items-start h-32">
<!-- Left Actions -->
<div class="flex items-center gap-stack-sm pt-4 pl-4 md:pl-0">
<button aria-label="Back" class="p-2 rounded-full hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-white text-3xl group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
</button>
<button aria-label="Help" class="p-2 rounded-full hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white text-3xl" data-icon="help_outline">help_outline</span>
</button>
</div>
<!-- Right Actions -->
<div class="pt-4 pr-4 md:pr-0">
<button class="text-white font-button-label text-button-label px-6 py-3 rounded-full shadow-lg hover:scale-105 active:scale-95 transition-all flex items-center gap-2" style="background: linear-gradient(135deg, rgb(79, 70, 229) 0%, rgb(129, 140, 248) 100%); border-radius: 24px; box-shadow: rgba(79, 70, 229, 0.25) 0px 4px 12px;">
<span class="material-symbols-outlined text-xl" data-icon="check_circle">check_circle</span>
                    Complete
                </button>
</div>
</header>
<!-- Bottom UI Overlay -->
<footer class="absolute bottom-0 left-0 w-full z-50 bottom-gradient px-screen-margin md:px-margin-desktop pb-stack-lg pt-16 flex flex-col items-center justify-end h-64 gap-stack-lg">
<!-- Main Controls Container -->
<div class="w-full max-w-md mx-auto flex flex-col gap-stack-md bg-white/10 backdrop-blur-md p-6 rounded-2xl border border-white/20 shadow-[0_10px_30px_rgba(79,70,229,0.1)]">
<!-- Opacity Slider Control -->
<div class="w-full flex flex-col gap-2">
<div class="flex justify-between items-center text-white font-caption text-caption">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="opacity">opacity</span>
                            Opacity
                        </span>
<span class="font-bold" id="opacityValue">50%</span>
</div>
<input class="w-full" id="opacitySlider" max="100" min="0" type="range" value="50">
</div>
<!-- Secondary Actions (Pill Buttons) -->
<div class="flex justify-center gap-stack-md mt-2">
<button class="bg-[#FAF7F2]/80 hover:bg-[#FAF7F2] text-on-surface font-caption text-caption px-5 py-2 rounded-full flex items-center gap-2 shadow-sm hover:shadow-md transition-all active:scale-95 backdrop-blur-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="flip">flip</span>
                        Mirror
                    </button>
<button class="bg-[#FAF7F2]/80 hover:bg-[#FAF7F2] text-on-surface font-caption text-caption px-5 py-2 rounded-full flex items-center gap-2 shadow-sm hover:shadow-md transition-all active:scale-95 backdrop-blur-sm">
<span class="material-symbols-outlined text-[18px]" data-icon="ac_unit">ac_unit</span>
                        Freeze
                    </button>
</div>
</div>
<!-- Bottom Nav Space Reservation (If part of a larger app flow, though transactional pages often hide it, we leave space per instructions if needed, but styling implies full screen takeover) -->
</footer>
</main>
<script>
        // Simple script to update the opacity value display
        const slider = document.getElementById('opacitySlider');
        const output = document.getElementById('opacityValue');
        
        // In a real app, this would also update the AR overlay opacity
        slider.oninput = function() {
            output.innerHTML = this.value + '%';
        }
    </script>


</body></html>
