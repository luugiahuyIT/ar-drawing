<script>
        // Micro-interactions for the onboarding flow
        document.querySelector('button.indigo-gradient').addEventListener('click', function() {
            // Simple haptic-like effect logic would go here
            console.log('Navigating to next onboarding slide...');
        });

        // Subtle parallax effect on hero illustration based on mouse/tilt
        const container = document.querySelector('.phone-frame');
        const hero = document.querySelector('img[src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjtRutp9axXpA76YCxAe3MnaQEz-4XTxbddepKcyeZ33-DMWNXV4kJT91gLg1LOhljNMePOhnxF9zYEgTtZ0VlVKZCtY1FLH_URcqypzl93RhQs6p0fCp6-0s4aQz6bN4C1uqdjLFpJsOwgkRp9_Xk_30Fn1Md5DItoLyac9jnicaNsDoYm-lmfHrhm5edP0F3SEtsI5bnLE9IUEh5Qd1sypvvVDQE2V1ew1XFMSnTjj6fkLWHH6YPtC91aJHn4CmM6Ho33ZeH0aCt"]');
        
        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            
            hero.style.transform = `translate(${x * 15}px, ${y * 15}px)`;
        });

        container.addEventListener('mouseleave', () => {
            hero.style.transform = `translate(0px, 0px)`;
            hero.style.transition = 'transform 0.5s ease-out';
        });
    </script>
